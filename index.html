<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="robots" content="noindex, nofollow">
<title>Placar de Tênis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <section id="login" class="screen" hidden>
    <div class="card narrow">
      <h1>Placar de Tênis</h1>
      <p class="muted">Entre com o login e a senha que você recebeu.</p>
      <label class="field"><span>Login</span><input id="loginUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="field"><span>Senha</span><input id="loginPass" type="password" autocomplete="current-password"></label>
      <p id="loginErr" class="err" role="alert"></p>
      <button id="loginBtn" class="btn primary big">Entrar</button>
    </div>
  </section>

  <section id="home" class="screen" hidden>
    <div class="card">
      <h1>Placar de Tênis</h1>
      <p id="homeVoice" class="muted"></p>
      <div class="stack">
        <button id="homeResume" class="btn accent big" hidden>Retomar partida</button>
        <button id="homeNew" class="btn primary big">Nova partida</button>
        <button id="homeVoices" class="btn big">Vozes</button>
        <button id="homeHistory" class="btn big">Histórico</button>
        <a id="homeDemo" class="btn big" href="demo3d.html">Modelo 3D (demonstração)</a>
        <button id="homeInstall" class="btn big" hidden>Instalar na tela inicial</button>
        <button id="homeLogout" class="btn ghost">Sair da conta</button>
      </div>
    </div>
  </section>

  <section id="wizard" class="screen" hidden>
    <div class="card wiz">
      <div class="wizhead"><button id="wizBack" class="btn ghost">Voltar</button><div id="wizDots" class="dots" aria-hidden="true"></div><button id="wizHome" class="btn ghost">Início</button></div>
      <h2 id="wizTitle"></h2>
      <div id="wizBody"></div>
      <div class="wizfoot"><button id="wizNext" class="btn primary big">Próximo</button></div>
    </div>
  </section>

  <section id="history" class="screen" hidden>
    <div class="card wide">
      <div class="wizhead"><button id="histBack" class="btn ghost">Voltar</button><h2>Histórico</h2><button id="histClear" class="btn ghost">Apagar tudo</button></div>
      <div id="histList"></div>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="panelwrap" id="panelWrap">
      <div class="pw" id="pw">
        <div id="gNames" class="names" hidden><span id="nameL"></span><span id="nameR"></span></div>
        <button id="gAction" class="btn accent action">Iniciar</button>
        <button id="gCallsBtn" class="btn calls">Chamadas</button>
      </div>
    </div>
    <button id="gPause" class="cbtn cl" aria-label="Pausa e menu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg></button>
    <button id="gUndo" class="cbtn cr" aria-label="Desfazer o último ponto"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="3" height="16" rx="1"/><path d="M20 4.5v15L8.5 12z"/></svg></button>
    <button id="sideL" class="zone zl" aria-label="Ponto para a esquerda">+</button>
    <button id="sideR" class="zone zr" aria-label="Ponto para a direita">+</button>
    <div id="gCalls" class="callspanel" hidden></div>
    <div id="gToast" class="toast" hidden></div>
    <div id="gPaused" class="pov" hidden></div>
    <div id="gEnd" class="endov" hidden></div>
  </section>

</main>
<div id="modal" class="modal" hidden></div>
<div id="rotate" class="rotate" hidden><div>Gire o aparelho para a horizontal</div></div>
<script src="auth-config.js"></script>
<script src="panel-geom.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
